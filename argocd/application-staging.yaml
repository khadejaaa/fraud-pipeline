apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/khadejaaa/fraud-pipeline.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
